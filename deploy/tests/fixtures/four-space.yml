tunnel: resolute
credentials-file: /root/.cloudflared/resolute.json
ingress:
    -   hostname: photos.example.com
        service: http://127.0.0.1:8080
    -   hostname: files.example.com
        path: ^/api/
        service: http_status:404
    -   hostname: files.example.com
        service: http://127.0.0.1:8090
    -   service: http_status:404
warp-routing:
    enabled: false
