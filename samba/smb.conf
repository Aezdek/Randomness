[global]
   server string = Past Papers
   server role = standalone server
   security = user
   passdb backend = tdbsam
   map to guest = never
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

   # Recommended settings for iPad and Mac clients.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

# The sorted library. Read-only, so nothing gets deleted from the iPad by accident.
[Past Papers]
   path = /data/library
   comment = Sorted past papers
   read only = yes
   valid users = @papers
   veto files = /.incoming/

# Drop papers here (from the Files app) and they get sorted into the library.
[Inbox]
   path = /data/inbox
   comment = Drop papers here to have them sorted
   read only = no
   valid users = @papers
   force group = papers
   create mask = 0664
   directory mask = 0775
