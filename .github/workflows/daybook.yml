name: Daybook

on:
  push:
    paths:
      - "daybook/**"
      - ".github/workflows/daybook.yml"
    tags: ["daybook-v*"]
  pull_request:
    paths:
      - "daybook/**"
      - ".github/workflows/daybook.yml"
  workflow_dispatch:

concurrency:
  group: daybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: daybook

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol, server and two-device sync tests
        run: ./gradlew --continue :core:jvmTest :server:test :shared:desktopTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daybook-test-reports
          path: "daybook/**/build/reports/tests/"
          if-no-files-found: ignore

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Uses DAYBOOK_* signing secrets if set, otherwise the AezPrint key already in this repository's
      # secrets, so every build is signed with the same key and installs as an update.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYBOOK_KEYSTORE_BASE64 || secrets.AEZPRINT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daybook-release.jks"
          echo "DAYBOOK_KEYSTORE_PATH=$RUNNER_TEMP/daybook-release.jks" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        id: apk
        env:
          DAYBOOK_KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_KEYSTORE_PASSWORD || secrets.AEZPRINT_KEYSTORE_PASSWORD }}
          DAYBOOK_KEY_ALIAS: ${{ secrets.DAYBOOK_KEY_ALIAS || secrets.AEZPRINT_KEY_ALIAS }}
          DAYBOOK_KEY_PASSWORD: ${{ secrets.DAYBOOK_KEY_PASSWORD || secrets.AEZPRINT_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            ./gradlew :androidApp:assembleRelease
            APK=$(ls androidApp/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)
          else
            echo "::warning title=Debug build::No signing key in secrets, so this is a debug APK. Add DAYBOOK_KEYSTORE_BASE64, DAYBOOK_KEYSTORE_PASSWORD, DAYBOOK_KEY_ALIAS and DAYBOOK_KEY_PASSWORD for signed release builds."
            ./gradlew :androidApp:assembleDebug
            APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          fi
          OUT="Daybook-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          echo "path=daybook/$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-android
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/daybook-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

  linux:
    name: Linux packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build .deb and runnable JAR
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageUberJarForCurrentOS
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb dist/
          cp desktopApp/build/compose/jars/*.jar dist/Daybook-linux-x64-1.0.${GITHUB_RUN_NUMBER}.jar
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-linux
          path: daybook/dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/daybook-v')
        uses: softprops/action-gh-release@v2
        with:
          files: daybook/dist/*

  server:
    name: Sync server
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build server distribution
        run: |
          ./gradlew :server:installDist
          tar -C server/build/install -czf daybook-server.tar.gz daybook-server
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-server
          path: daybook/daybook-server.tar.gz
      - name: Build image
        run: docker build -t daybook-server server
      # The image is only published for a release tag or a manual run, never for an ordinary push.
      - name: Push image to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/daybook-v') || github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag daybook-server "ghcr.io/$OWNER/daybook-server:latest"
          docker tag daybook-server "ghcr.io/$OWNER/daybook-server:1.0.${GITHUB_RUN_NUMBER}"
          docker push "ghcr.io/$OWNER/daybook-server:latest"
          docker push "ghcr.io/$OWNER/daybook-server:1.0.${GITHUB_RUN_NUMBER}"
