name: Past papers

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pastpapers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Install smbclient
        run: sudo apt-get update -q && sudo apt-get install -y -q smbclient

      - name: End-to-end test (containers + file share)
        run: ./scripts/smoke-test.sh
