name: Aria

on:
  push:
    branches: [aria]
  pull_request:
    branches: [aria]
  workflow_dispatch:

concurrency:
  group: aria-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build .deb for jailbroken iOS 9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Check the proxy compiles
        run: python3 -m py_compile server/aria_proxy.py

      - name: Install Theos, the iOS toolchain and the iOS 12.4 SDK (armv7)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync >/dev/null
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -sSLf https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS12.4.sdk
          mv /tmp/sdks/iPhoneOS12.4.sdk "$THEOS/sdks/"

      - name: Build package
        working-directory: app
        run: make package FINALPACKAGE=1

      - name: Check the app only uses symbols iOS 9 has
        working-directory: app
        run: |
          # Empty @[] literals and @available compile to symbols missing on iOS 9, which crash at launch.
          bad=$("$THEOS/toolchain/linux/iphone/bin/nm" -arch armv7 -u .theos/obj/Aria.app/Aria | grep -E '___NSArray0__|___NSDictionary0__|isPlatformVersionAtLeast|isOSVersionAtLeast' || true)
          if [ -n "$bad" ]; then echo "::error::Symbols iOS 9 lacks: $bad"; exit 1; fi

      - name: Read version
        id: version
        run: |
          echo "version=$(sed -n 's/^Version: //p' app/control)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aria-deb
          path: app/packages/*.deb

      # Every push to aria publishes the build as release aria-v<Version from app/control>.
      # Bump the version there to make a new release; pushes without a bump refresh the same one.
      # The Aria server downloads the newest aria-v* release for the iPod to install.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/aria'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aria ${{ steps.version.outputs.version }}
          body: |
            Install on a jailbroken iPod: start the server (`server/run.bat` or `server/run.sh`), open its address in Safari on the iPod, and tap **Install Aria**. Full guide: https://github.com/${{ github.repository }}/tree/aria#install
          files: app/packages/*.deb
          overwrite_files: true
          make_latest: false

      # The first release's download link is shared (and shortened), so it always serves the newest build.
      - name: Point the permanent install link at this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/aria'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p link && cp app/packages/*.deb link/xyz.aezdek.aria_1.0.0_iphoneos-arm.deb
          gh release upload aria-v1.0.0 link/xyz.aezdek.aria_1.0.0_iphoneos-arm.deb --clobber --repo "$GITHUB_REPOSITORY"

  wear:
    name: Build the Wear OS watch app and the phone app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon :watch:assembleRelease :phone:assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p out
          cp watch/build/outputs/apk/release/watch-release.apk out/aria-watch.apk
          cp phone/build/outputs/apk/release/phone-release.apk out/aria-phone.apk
          ls -la out
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' watch/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aria-wear-apks
          path: wear/out/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wear-test-reports
          path: wear/**/build/reports/

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/aria'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria-wear-v${{ steps.apks.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aria for Wear OS ${{ steps.apks.outputs.version }}
          body: |
            aria-watch.apk goes on the Galaxy Watch (install with adb over Wi-Fi), aria-phone.apk on the Android phone.
            Guide: https://github.com/${{ github.repository }}/tree/aria/wear#readme
          files: wear/out/*.apk
          overwrite_files: true
          make_latest: false
