name: Aria

on:
  push:
    branches: [aria]
  pull_request:
    branches: [aria]
  workflow_dispatch:

concurrency:
  group: aria-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build .deb for jailbroken iOS 9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Check the proxy compiles
        run: python3 -m py_compile server/aria_proxy.py

      - name: Install Theos, the iOS toolchain and the iOS 12.4 SDK (armv7)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync >/dev/null
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -sSLf https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS12.4.sdk
          mv /tmp/sdks/iPhoneOS12.4.sdk "$THEOS/sdks/"

      - name: Build package
        working-directory: app
        run: make package FINALPACKAGE=1

      - name: Read version
        id: version
        run: |
          echo "version=$(sed -n 's/^Version: //p' app/control)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aria-deb
          path: app/packages/*.deb

      # Every push to aria publishes the build as release aria-v<Version from app/control>.
      # Bump the version there to make a new release; pushes without a bump refresh the same one.
      # The Aria server downloads the newest aria-v* release for the iPod to install.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/aria'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aria-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aria ${{ steps.version.outputs.version }}
          body: |
            Install on a jailbroken iPod: start the server (`server/run.bat` or `server/run.sh`), open its address in Safari on the iPod, and tap **Install Aria**. Full guide: https://github.com/${{ github.repository }}/tree/aria#install
          files: app/packages/*.deb
          make_latest: false
