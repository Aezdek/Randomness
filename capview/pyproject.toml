[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capview"
version = "0.1.0"
description = "Low-latency HDMI capture card viewer for Linux (GTK4/libadwaita, mpv, PipeWire)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
capview = "capview.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["capview.window", "capview.app", "capview.tasks"]
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
pythonpath = ["src"]
